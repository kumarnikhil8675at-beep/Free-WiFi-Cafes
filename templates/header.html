<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>One Page Wonder - Start Bootstrap Template</title>
    <link rel="icon" type="image/x-icon" href="../static/assets/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Catamaran:100,200,300,400,500,600,700,800,900"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato:100,100i,300,300i,400,400i,700,700i,900,900i"
        rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="../static/css/styles.css" rel="stylesheet" />
    <style>
    .form-label {
        font-weight: bold;
    }
    .navbar-custom .nav-link {
        white-space: nowrap;
    }

    .navbar-search {
        width: 180px;
        flex-shrink: 0;
    }

    /* Mobile aur tablet */
    @media (max-width: 991.98px) {
        .navbar-search {
            width: 100%;
        }

        .navbar-collapse {
            padding-top: 8px;
        }

        .navbar-collapse .navbar-nav {
            align-items: flex-start;
        }
    }
</style>
    {{ bootstrap.load_css() }}
</head>

<body id="page-top">
    <!-- Navigation-->

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top py-2" id="navbar">
    <div class="container">

        <!-- Logo + Mobile Menu Button -->
        <a href="/" class="navbar-brand text-white text-decoration-none me-2 mb-0">
            <svg width="36" height="30" role="img" aria-label="Bootstrap">
                <use href="#bootstrap"></use>
            </svg>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse" id="navbarContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a href="{{ url_for('home') }}" class="nav-link text-white">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('about')}}" class="nav-link text-white">About</a>
                </li>
            </ul>

            <!-- Login / Signup -->
            {% if not current.is_authenticated %}
            <div class="d-flex align-items-center flex-nowrap">
                <a href="{{ url_for('loger') }}"
                   class="nav-link px-2 text-white">Login</a>

                <a href="{{ url_for('sing') }}"
                   class="nav-link px-2 text-white">Sign up</a>
            </div>

            {% else %}
            <div class="d-flex align-items-center gap-3 flex-nowrap">
                <a class="text-decoration-none fw-bold text-white"
                   href="{{ url_for('dashboard') }}">Dashboard</a>

                <a href="{{ url_for('logout') }}"
                   class="nav-link text-white">Logout</a>

                <span class="text-white px-2 border border-2 rounded-pill">
                    {{ current.Name[0] | upper }}
                </span>
            </div>
            {% endif %}

        </div>
    </div>
</nav>
